# Second player: inherits everything from v0.yaml (paths, engine, Maia, ...) and overrides the player.
#   python main.py --config configs/fawzx.yaml
# Data lands in data/players/fawzx/; peers of his band in data/population_2200_2400/ (shared with anyone
# else in that band). Nothing of the other player's data is touched.
extends: v0.yaml

player:
  username: fawzx
  # chess.com rapid ~2091: compare with peers only on games >= this (~150 below the current rating)
  min_player_rating: 1950
  fetch_min_rating: 0          # whole history (progress over time); raise it to save engine time

population:
  # Lichess equivalent of chess.com ~2091 is roughly 2250-2300 (chess.com + 150..200 around this level);
  # calibrate with scripts/diagnostics/02b_engine_summary.py after the engine pass
  rating_center: 2300
  rating_halfwidth: 100

maia:
  # starting values only: 09b fits this player's offset and saves it (players/fawzx/player/maia_offset.json),
  # which then overrides these automatically
  player_offset: 150
  player_offset_slope: 0.0

multiband:
  # 2000-2200 is the other player's peer set (reused, not mined again); 2200-2400 is this player's own
  bands: [[1600, 1800], [1800, 2000], [2000, 2200], [2400, 3000]]
