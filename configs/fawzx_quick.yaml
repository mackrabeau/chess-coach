# Quick test of the head-to-head report without the full ~15 h pipeline for fawzx:
#   python main.py --config configs/fawzx_quick.yaml --only fetch,engine-player,openings,opening-findings,multiband --skip-maia
#   python scripts/23_compare_players.py --config configs/v0.yaml --other configs/fawzx_quick.yaml
# Uses only his recent games, reuses the 2000-2200 peers and the existing bands (nothing mined), and skips
# the opening book's dump pass. Same data folder as the full run (data/players/fawzx), so the engine work
# is kept when you later run configs/fawzx.yaml. Levels are relative to the shared bands, so they still
# compare; his population-based findings (skill profile, ideas, ...) are left out.
extends: fawzx.yaml

player:
  fetch_min_rating: 1950       # recent games only (fewer positions for Stockfish)

population:
  rating_center: 2100          # reuse the existing 2000-2200 peer set; no new mining

openings:
  book: false                  # skip the Lichess dump pass (only needed for the traps / repertoire)
